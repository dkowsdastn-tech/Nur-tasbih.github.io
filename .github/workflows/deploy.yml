name: Deploy Nur website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir site
          cp islamic-pwa/index.html site/
          cp islamic-pwa/manifest.webmanifest site/
          cp islamic-pwa/sw.js site/
          cp -R islamic-pwa/assets site/
          cp -R islamic-pwa/css site/
          cp -R islamic-pwa/js site/
          cp -R islamic-pwa/locales site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
